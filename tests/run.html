<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTask — тесты</title>
<link rel="stylesheet" href="../css/app.css?v=dev">
<style>#results{position:fixed;left:0;top:0;right:0;bottom:0;z-index:999;background:#000;color:#ddd;font:12px/1.5 monospace;padding:12px;overflow:auto;white-space:pre-wrap}
#results .ok{color:#4CC08A}#results .fail{color:#ff6b6b;font-weight:700}</style>
<!-- Запуск: msedge --headless=new --allow-file-access-from-files --window-size=390,844 --virtual-time-budget=20000 --dump-dom tests/run.html
     Итог в <pre id="results"> и в <title> (RESULT: N passed, M failed). Мобильная ширина по умолчанию;
     ?split=1 — проверки трёхколоночного режима (окно ≥1024 в ландшафте). -->
</head>
<body>
<header class="hidden" id="hdr"><div class="brand"><div class="logo"><div class="mark">F</div><div class="name">FTask</div><span class="sync" id="sync"></span></div><div class="user" id="user"></div></div><div class="rail" id="pipe"></div></header>
<nav id="nav" class="hidden"></nav>
<main id="app"></main>
<aside class="detail empty" id="detail"></aside>
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<pre id="results">running…</pre>
<script type="module">
import { makeServer, makeFixtures } from "./demo-data.js";
import * as L from "../supabase/functions/kreo-api/logic.js";
const R = document.getElementById("results"); let pass = 0, fail = 0;
const log = (ok, name, extra) => { pass += ok ? 1 : 0; fail += ok ? 0 : 1; R.innerHTML += '<span class="' + (ok ? "ok" : "fail") + '">' + (ok ? "PASS " : "FAIL ") + name + '</span>' + (extra ? " — " + extra : "") + "\n"; };
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const T = async (name, fn) => { try { const r = await fn(); if (r === true || r === undefined) log(true, name); else log(false, name, String(r)); } catch (e) { log(false, name, e && e.stack ? e.stack.split("\n").slice(0, 2).join(" ") : String(e)); } };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const $ = (s, root) => (root || document).querySelector(s);

/* ================= 1. logic.js — контракт сервера (чистые функции) ================= */
R.innerHTML = "== logic.js ==\n";
const now = "2026-09-13T00:00:00Z";
await T("claim свободного → патч с условием assignee IS NULL", () => { const r = L.statusTransition({ cur: { status: "queued", assignee_tg_id: null }, me: 1, isAdmin: false, target: "in_progress", nowIso: now });
  return r.ok && r.patch.assignee_tg_id === 1 && r.cond.assignee_null === true || JSON.stringify(r); });
await T("claim чужого → already_claimed (даже админу — нужен assign_creo)", () => { const a = L.statusTransition({ cur: { status: "in_progress", assignee_tg_id: 2 }, me: 1, isAdmin: false, target: "in_progress", nowIso: now });
  const b = L.statusTransition({ cur: { status: "in_progress", assignee_tg_id: 2 }, me: 1, isAdmin: true, target: "in_progress", nowIso: now });
  return a.error === "already_claimed" && b.error === "already_claimed" || JSON.stringify([a, b]); });
await T("повтор своего in_progress — идемпотентно (noop)", () => { const r = L.statusTransition({ cur: { status: "in_progress", assignee_tg_id: 1 }, me: 1, isAdmin: false, target: "in_progress", nowIso: now }); return r.ok && r.noop === true || JSON.stringify(r); });
await T("done → in_progress своё: без смены исполнителя", () => { const r = L.statusTransition({ cur: { status: "done", assignee_tg_id: 1 }, me: 1, isAdmin: false, target: "in_progress", nowIso: now }); return r.ok && !("assignee_tg_id" in r.patch) && r.cond.assignee === 1 || JSON.stringify(r); });
await T("queued чужого не-админом → forbidden; админом → ok с условием на текущего", () => { const a = L.statusTransition({ cur: { status: "in_progress", assignee_tg_id: 2 }, me: 1, isAdmin: false, target: "queued", nowIso: now });
  const b = L.statusTransition({ cur: { status: "in_progress", assignee_tg_id: 2 }, me: 1, isAdmin: true, target: "queued", nowIso: now });
  return a.error === "forbidden" && b.ok && b.patch.assignee_tg_id === null && b.cond.assignee === 2 || JSON.stringify([a, b]); });
await T("done чужого не-админом → forbidden", () => L.statusTransition({ cur: { status: "in_progress", assignee_tg_id: 2 }, me: 1, isAdmin: false, target: "done", nowIso: now }).error === "forbidden");
await T("плохой статус / нет строки", () => L.statusTransition({ cur: { status: "queued" }, me: 1, target: "posted", nowIso: now }).error === "bad_status" && L.statusTransition({ cur: null, me: 1, target: "done" }).error === "not_found");
await T("mergePaths: новые в конец, дубли не добавляются", () => eq(L.mergePaths(["a", "b"], ["b", "c", "", "c"]), ["a", "b", "c"]) && eq(L.mergePaths(null, ["x"]), ["x"]));
await T("normNicheName: пробелы, регистр ключа, пустое, длина", () => L.normNicheName("  Кос   плей ") === "Кос плей" && L.normNicheName("   ") === null && L.nicheKey("  КОСПЛЕЙ ") === "косплей" && L.normNicheName("x".repeat(80)).length === 60);
await T("normNicheIds: числа, без дублей, ≤20", () => eq(L.normNicheIds(["1", 2, 2, "x", -1, 0]), [1, 2]) && L.normNicheIds(Array.from({ length: 30 }, (_, i) => i + 1)).length === 20);
await T("defer/restore: не трогают статус и исполнителя, идемпотентны", () => { const d = L.deferPatch({ cur: { status: "in_progress", assignee_tg_id: 2 }, me: 1, nowIso: now });
  const d2 = L.deferPatch({ cur: { deferred_at: now }, me: 1, nowIso: now }); const r = L.restorePatch({ cur: { deferred_at: now } }); const r2 = L.restorePatch({ cur: {} });
  return d.ok && !("status" in d.patch) && !("assignee_tg_id" in d.patch) && d2.noop && r.patch.deferred_at === null && r2.noop || JSON.stringify([d, d2, r, r2]); });
await T("normNotes: пустое → null, обрезка 4000, CRLF", () => L.normNotes("  ") === null && L.normNotes("a\r\nb") === "a\nb" && L.normNotes("x".repeat(5000)).length === 4000);
await T("deliverExtra: done+pending, подпись ≤1024", () => { const e = L.deliverExtra({ caption: "c".repeat(2000), nowIso: now }); return e.status === "done" && e.delivery_state === "pending" && e.result_caption.length === 1024; });
await T("latestVideoPath: берёт последнее видео и пропускает фото", () => { const r=L.latestVideoPath({result_paths:["a.mp4","b.jpg","c.mov","d.png"]});return r.path==="c.mov"&&r.index===2; });
await T("normalizeDeliveryDraft: 1–10, явный уровень, порядок и индивидуальный приоритет", () => { const r=L.normalizeDeliveryDraft({mode:"immediate",timezone:"Europe/Warsaw",default_level:"medium",items:[{creo_id:7},{creo_id:8,uniq_level:"strong"}]});return r.ok&&r.value.items[0].position===0&&r.value.items[0].uniq_level==="medium"&&r.value.items[1].uniq_level==="strong"&&!L.normalizeDeliveryDraft({timezone:"UTC",default_level:"none",items:[{creo_id:1}]}).ok; });
await T("normalizeDeliveryDraft: дата планирования хранится UTC, дубль крео запрещён", () => { const a=L.normalizeDeliveryDraft({mode:"scheduled",deliver_at:"2026-10-25T16:00:00Z",timezone:"Europe/Warsaw",default_level:"weak",items:[{creo_id:1}]});const b=L.normalizeDeliveryDraft({mode:"immediate",timezone:"UTC",default_level:"weak",items:[{creo_id:1},{creo_id:1}]});return a.ok&&a.value.deliver_at==="2026-10-25T16:00:00.000Z"&&b.error==="bad_items"; });

/* ================= 2. фронт на фикстурах (demo-сервер = та же логика) ================= */
R.innerHTML += "\n== фронт ==\n";
const srv = makeServer(1);
window.__FTASK_DEMO__ = (a, p) => srv.handle(a, p);
try { localStorage.removeItem("ftask.prefs"); } catch (e) {}
const load = (src) => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
for (const f of ["core", "catalog", "download", "upload", "views", "delivery"]) await load("../js/" + f + ".js?v=dev");
await boot();
const split = new URLSearchParams(location.search).get("split") === "1";
const cardsN = () => document.querySelectorAll(".cc").length;

await T("стартовый экран — «Свободные», счётчики совпадают с данными", () => S.tab === "cat" && S.view === "free" && cardsN() === catList("free").length && cardsN() === 10 || "cards=" + cardsN());
await T("поиск по подписи / нише / ID / исполнителю", () => { S.q = "косплей"; render(); const a = catList(); S.view = "work"; const b = catList();
  S.q = "#3"; const c = catList(); S.q = "Каплан"; const d = catList(); S.q = "Кафе"; S.view = "free"; const e = catList(); S.q = ""; render();
  const has = (l, t) => l.length && l.every((x) => catText(x).includes(t));
  return has(a, "косплей") && has(b, "косплей") && c.length === 1 && c[0].id === 3 && d.every((x) => x.assignee_tg_id === 1) && d.length >= 1 && has(e, "кафе")
    || [a.length, b.length, c.length, d.length, e.length].join(","); });
await T("виды: В работе / Готовые / Отложенные исключают друг друга; отложенное не в активных", () => {
  const f = catList("free"), w = catList("work"), d = catList("done"), z = catList("deferred"); const ids = (l) => l.map((c) => c.id);
  const inter = ids(f).filter((i) => ids(w).includes(i) || ids(d).includes(i) || ids(z).includes(i));
  return inter.length === 0 && z.length === 1 && z[0].id === 6 && !ids(f).includes(6) || "z=" + ids(z); });
await T("фильтр «Мои» в работе — только мои; в готовых — мои или опубликованные мной", () => { S.view = "work"; S.mine = true; const w = catList(); S.view = "done"; const d = catList(); S.mine = false; S.view = "free";
  return w.every((c) => c.assignee_tg_id === 1) && w.length > 0 && d.every((c) => c.assignee_tg_id === 1 || iPosted(c)) || "w=" + w.length; });
await T("фильтр «Без ниши» / по нише", () => { S.view = "work"; S.niche = "none"; const a = catList(); S.niche = "1"; const b = catList(); S.niche = ""; S.view = "free";
  return a.every((c) => !c.niche_ids.length) && b.every((c) => c.niche_ids.includes(1)) && b.length >= 1 || "a=" + a.length + " b=" + b.length; });
await T("плитка референса показывает исходник, готового — результат, недоступное — состояние", () => {
  const m1 = tileMedia(S.creos.find((c) => c.id === 1)), m5 = tileMedia(S.creos.find((c) => c.id === 5)), m2 = tileMedia(S.creos.find((c) => c.id === 2));
  return m1.lbl === "исходник" && m1.ref[1] === "source_poster_url" && m5.lbl === "результат" && m2.none === true && srcState(S.creos.find((c) => c.id === 2)).txt.includes("20 МБ") || JSON.stringify([m1, m5, m2]); });
await T("режим выбора есть только в «Готовых», карточка остаётся открываемой", () => {S.view="done";S.deliveryPickMode=true;S.deliveryPick=[];render();const c=S.creos.find(x=>x.id===5),card=document.querySelector('.cc[data-open="5"]');const badge=card.querySelector('[data-dpick="5"]');badge.click();const selected=pickHas(5)&&S.deliveryPick.length===1;card.click();const opened=S.open===5;closeDetail(true);S.deliveryPickMode=false;S.deliveryPick=[];S.view="free";render();return selected&&opened&&!document.querySelector(".pickbar");});
await T("последняя версия видео в смешанных result_paths выбирается с конца", () => {const c={id:99,result_paths:["v1.mp4","photo.jpg","v2.webm","new.png"],result_urls:["1","2","3","4"]};const v=latestVideo(c);return v.source_path==="v2.webm"&&v.source_index===2&&v.url==="3";});
await T("Europe/Warsaw DST: локальное время переводится в правильный UTC; несуществующее отклоняется", () => zonedToIso("2026-09-20T17:00","Europe/Warsaw")==="2026-09-20T15:00:00.000Z"&&zonedToIso("2026-03-29T02:30","Europe/Warsaw")===null);
await T("одиночная уникализация открывает тот же мастер и может стать отложенной", async () => {const c=S.creos.find(x=>x.id===5),v=latestVideo(c);await openDeliveryWizard("immediate",[v]);const scheduled=document.querySelector('[data-dmode="scheduled"]');scheduled.click();const ok=S.deliveryDraft.mode==="scheduled"&&!!document.getElementById("dwtime")&&!!document.getElementById("dwtz");closeDeliveryWizard();return ok;});
await T("открытие карточки: на телефоне — слой поверх, список не перерисован; закрытие возвращает", async () => {
  S.view = "work"; render(); const grid = $(".cgrid"); openDetail(3); await sleep(50);
  const d = $("#detail"); const shown = split ? d.classList.contains("empty") === false : d.classList.contains("show");
  const same = $(".cgrid") === grid; const open = $('.cc[data-open="3"]').classList.contains("open");
  closeDetail(); await sleep(50);
  return shown && same && open && S.open === null && !$("#detail").classList.contains("show") || [shown, same, open, S.open].join(","); });
await T("карточка: действия по состоянию (моё в работе → загрузить/в свободные/готово/отложить)", () => { openDetail(3); const acts = [...document.querySelectorAll("#detail [data-dact]")].map((b) => b.dataset.dact);
  return ["upload", "queue", "done", "defer"].every((a) => acts.includes(a)) || acts.join(","); });
await T("карточка чужого в работе: нет «загрузить», есть переназначение админа", () => { openDetail(4); const acts = [...document.querySelectorAll("#detail [data-dact]")].map((b) => b.dataset.dact);
  return !acts.includes("upload") && !!$("#dassign") || acts.join(","); });
await T("claim: второй пользователь получает already_claimed, исполнитель не меняется", async () => {
  const srv2 = makeServer(2, srv.db); let err = null; try { await srv2.handle("claim_creo", { id: 3 }); } catch (e) { err = e; }
  return err && err.message === "already_claimed" && srv.db.creos.find((c) => c.id === 3).assignee_tg_id === 1 || String(err); });
await T("set_creo_status(in_progress) НЕ перехватывает чужое (ревью B)", async () => {
  const srv2 = makeServer(2, srv.db); let err = null; try { await srv2.handle("set_creo_status", { id: 3, status: "in_progress", claim: true }); } catch (e) { err = e; }
  return err && err.message === "already_claimed" && srv.db.creos.find((c) => c.id === 3).assignee_tg_id === 1 || String(err); });
await T("взять свободное из плитки → в работе у меня", async () => { S.view = "free"; render(); await creoAction("claim", 1); const c = S.creos.find((x) => x.id === 1);
  return c.status === "in_progress" && c.assignee_tg_id === 1 && catList("work").some((x) => x.id === 1) || c.status; });
await T("отложить → в «Отложенные», статус/исполнитель сохранены; вернуть → как было", async () => { await creoAction("defer", 1); const c = S.creos.find((x) => x.id === 1);
  const a = !!c.deferred_at && c.status === "in_progress" && c.assignee_tg_id === 1 && catList("deferred").some((x) => x.id === 1) && !catList("work").some((x) => x.id === 1);
  await creoAction("restore", 1); const b = !c.deferred_at && c.status === "in_progress" && catList("work").some((x) => x.id === 1);
  return a && b || [a, b].join(","); });
await T("ниши в карточке: toggle → set_creo_niches; новая ниша через prompt; дубль по регистру → та же", async () => {
  openDetail(1); await setNiches(1, [1, 2]); const c = S.creos.find((x) => x.id === 1); const a = eq(c.niche_ids, [1, 2]);
  window.prompt = () => "  кОсплей "; const n = await newNiche(); const b = n && n.id === 1 && S.niches.length === 3;
  window.prompt = () => "Ретро"; const n2 = await newNiche(); const d = n2 && n2.name === "Ретро" && S.niches.some((x) => x.name === "Ретро");
  window.prompt = () => "   "; const n3 = await newNiche(); return a && b && d && n3 === null || [a, b, d, n3].join(","); });
await T("удаление ниши не трогает крео", async () => { const before = S.creos.length; await srv.handle("delete_niche", { id: 3 }); const d = await srv.handle("bootstrap"); absorb(d);
  return S.creos.length === before && !S.niches.some((n) => n.id === 3) && S.creos.every((c) => !c.niche_ids.includes(3)) || "len"; });
await T("несколько загрузок: новые результаты первыми, старые доступны", async () => { openDetail(5); await srv.handle("deliver_creo", { id: 5, paths: ["2/9_zz_v3.jpg"], caption: "v3", niche_ids: [1] });
  const d = await srv.handle("bootstrap"); absorb(d); S._sig = sigOf(); renderDetail();
  const rows = [...document.querySelectorAll("#detail .result-files .rrow .rn")].map((x) => x.textContent); const c = S.creos.find((x) => x.id === 5);
  return c.result_paths.length === 3 && rows.length === 3 && rows[0].startsWith("v3.jpg") && rows[0].includes("последний") && rows[2].includes("результат 1 из 3")
    && $("#detail .rrow.new") && frames(c).filter((f) => f.res)[0].n === 3 || rows.join("|"); });
await T("заметки: автосохранение после ввода, переживает перерисовку", async () => { openDetail(1); const n = $("#dnotes"); n.value = "переделать свет"; n.dispatchEvent(new Event("input")); await sleep(950);
  const c = S.creos.find((x) => x.id === 1); render(); openDetail(1); return c.notes === "переделать свет" && $("#dnotes").value === "переделать свет" || String(c.notes); });
await T("заметки при ошибке сети: состояние «не сохранилось», текст в поле остаётся", async () => { srv.fail = { set_notes: true }; openDetail(1); const n = $("#dnotes"); n.value = "офлайн текст"; n.dispatchEvent(new Event("input")); await sleep(950);
  const st = $("#nstate").textContent; const keep = $("#dnotes").value === "офлайн текст"; srv.fail = null; return st.includes("не сохранилось") && keep || st; });
await T("сетевая ошибка действия → понятный тост, состояние не сломано", async () => { srv.fail = { defer_creo: true }; let toasts = document.querySelectorAll(".toast").length; await creoAction("defer", 4);
  const c = S.creos.find((x) => x.id === 4); srv.fail = null; return !c.deferred_at && document.querySelectorAll(".toast").length > toasts && [...document.querySelectorAll(".toast")].some((t) => t.textContent.includes("сети")) || "toast"; });
await T("медиа: свежие подписанные URL подставляются без перерисовки (E)", async () => { S.view = "free"; S.q = ""; render(); const img = $('.cc img[data-mref]'); const before = img.getAttribute("src");
  const grid = $(".cgrid"); await poll(); const after = img.getAttribute("src"); return before !== after && $(".cgrid") === grid && after === mediaUrl(...img.dataset.mref.split("|")) || "same url"; });
await T("медиа: играющее видео не трогаем при refresh", () => { const v = document.createElement("video"); v.dataset.mref = "5|result_urls|1"; v.src = "x"; Object.defineProperty(v, "paused", { value: false }); document.body.appendChild(v);
  refreshMedia(document.body); const keep = v.getAttribute("src") === "x"; v.remove(); return keep; });
await T("черновик задачи: ввод → смена вкладки → возврат, текст и исполнители на месте (D)", async () => { S.tab = "tasks"; render(); $("#tShow").click(); const t = $("#tT"); t.value = "Новая незаписанная"; t.dispatchEvent(new Event("input"));
  $('[data-asg="2"]').click(); S.tab = "cat"; header(); render(); S.tab = "tasks"; header(); render();
  const ok = $("#tT").value === "Новая незаписанная" && $("#asgCnt").textContent === "1" && JSON.parse(localStorage.getItem("ftask.prefs")).tDraft.title === "Новая незаписанная";
  $("#tCancel").click(); return ok && !S.tDraft.title || "draft lost"; });
await T("переход между вкладками сохраняет фильтры каталога", () => { S.tab = "cat"; S.view = "done"; S.pub = "any"; S.q = "кафе"; savePrefs(); S.tab = "team"; header(); render(); S.tab = "cat"; header(); render();
  const ok = S.view === "done" && S.pub === "any" && $("#cq").value === "кафе"; S.q = ""; S.pub = ""; S.view = "free"; savePrefs(); return ok; });
await T("Трекер: вступления, воронка и мои аккаунты доступны из навигации", async () => { S.tab = "keitaro"; S.keitTab = "joins"; render(); await sleep(50); const a = !!$(".lead"); S.keitTab = "funnel"; S.funnel = null; render(); await sleep(50); const f = !!$(".sgrid") && !!$(".lead"); S.keitTab = "acc"; render(); const b = !!$(".accrow"); S.tab = "cat"; return a && f && b || [a, f, b].join(","); });
await T("Команда: люди и статистика", () => { S.tab = "team"; S.teamTab = "people"; render(); const a = document.querySelectorAll(".row").length === 3; S.teamTab = "stats"; render(); const b = !!$(".sgrid"); S.tab = "cat"; return a && b; });
await T("лист загрузки: ниши крео подставлены, «+ Новая ниша» есть", () => { openSheet(5); const on = [...document.querySelectorAll('#sheet [data-un].on')].map((b) => +b.dataset.un); const add = !!$('#sheet [data-un="new"]'); closeSheet(); return eq(on.sort(), [1]) && add || on.join(","); });
await T("удаление крео закрывает карточку", async () => { openDetail(10); window.confirm = () => true; await delCreo(10); return S.open === null && !S.creos.some((c) => c.id === 10); });

const {runDownloadTests} = await import("./download-tests.js");
await runDownloadTests(T);
document.title = "RESULT: " + pass + " passed, " + fail + " failed";
R.innerHTML += "\n" + document.title;
</script>
</body>
</html>
