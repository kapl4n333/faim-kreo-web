<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>FTask</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============================ токены (тема из Telegram) ============================ */
:root{
  --bg: var(--tg-theme-bg-color, #0e0f13);
  --text: var(--tg-theme-text-color, #eef1f6);
  --hint: var(--tg-theme-hint-color, #8a92a6);
  --surface: color-mix(in srgb, var(--text) 6.5%, var(--bg));
  --raise: color-mix(in srgb, var(--text) 11%, var(--bg));
  --line: color-mix(in srgb, var(--text) 13%, transparent);
  --line-soft: color-mix(in srgb, var(--text) 7%, transparent);
  --a:#ff3b6b; --a2:#ff7a4d;                          /* фирменный акцент FTask */
  --a-dim: color-mix(in srgb, var(--a) 15%, transparent);
  --q:#f6a935; --p:#3aa0ff; --d:#22c58a; --o:#a274ff; /* очередь / работа / готово / залито */
  --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --disp:"Space Grotesk",-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:11px; --r:15px; --r-lg:20px;
  --sh: 0 4px 16px -8px rgba(0,0,0,.30), 0 1px 2px rgba(0,0,0,.10);
  --sh-lg: 0 16px 40px -12px rgba(0,0,0,.44);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-appearance:none}
img{display:block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ============================ шапка ============================ */
header{position:sticky;top:0;z-index:20;padding:13px 18px 0;
  background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(1.5) blur(16px);
  border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:9px}
.mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-family:var(--disp);
  font-weight:700;font-size:18px;box-shadow:0 4px 13px -2px color-mix(in srgb,var(--a) 55%,transparent)}
.name{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.02em}
.sync{width:7px;height:7px;border-radius:50%;background:var(--d);opacity:.3;
  transition:opacity .35s,transform .35s;cursor:pointer;flex:0 0 auto}
.sync.on{opacity:1;transform:scale(1.5)}
.user{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--hint);min-width:0}
.user .un{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.03em;
  background:var(--a-dim);color:var(--a);font-family:var(--disp);flex:0 0 auto}

/* сигнатура — конвейер статусов */
.rail{display:flex;margin:13px 0 12px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.rail .st{flex:1;padding:10px 4px 9px;text-align:center;min-width:0}
.rail .st + .st{border-left:1px solid var(--line-soft)}
.rail .st .n{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rail .st .l{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--hint);
  margin-top:5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.rail .st .l::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--hint)}
.rail .st.q .n{color:var(--q)} .rail .st.q .l::before{background:var(--q)}
.rail .st.p .n{color:var(--p)} .rail .st.p .l::before{background:var(--p)}
.rail .st.d .n{color:var(--d)} .rail .st.d .l::before{background:var(--d)}
.rail .st.o .n{color:var(--o)} .rail .st.o .l::before{background:var(--o)}

nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{padding:11px 3px;margin-right:15px;font-size:14.5px;font-weight:600;color:var(--hint);
  white-space:nowrap;position:relative;transition:color .2s}
nav button:last-child{margin-right:2px}
nav button.on{color:var(--text)}
nav button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:2px;
  background:linear-gradient(90deg,var(--a),var(--a2))}
/* шапку центрируем по той же ширине, что и контент (для Telegram Desktop) */
header .brand,header .rail,header nav{max-width:680px;margin-left:auto;margin-right:auto}

/* ============================ контент ============================ */
main{padding:16px 18px 24px;max-width:680px;margin:0 auto;animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.filters{display:flex;gap:9px;margin-bottom:14px}
.filters select{flex:1;background:var(--surface);color:var(--text);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;font-weight:500;box-shadow:var(--sh)}
.empty{text-align:center;color:var(--hint);padding:46px 20px;font-size:13.5px;line-height:1.55}
.empty .e-ic{font-size:32px;margin-bottom:12px;opacity:.5}
.empty .e-h{font-family:var(--disp);font-size:16px;font-weight:600;color:var(--text);margin-bottom:5px}
.hh{font-family:var(--disp);font-weight:600;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--hint);margin:20px 2px 11px;display:flex;align-items:center;gap:8px}
.hh .c{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:20px;
  background:var(--raise);color:var(--hint);letter-spacing:0}

/* ============================ карточка крео ============================ */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  padding:14px;margin-bottom:11px;box-shadow:var(--sh)}
.card .head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.av{width:38px;height:38px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;
  color:#fff;font-family:var(--disp);font-weight:700;font-size:15px}
.who{font-weight:600;font-size:14.5px;line-height:1.2}
.sub{font-size:11.5px;color:var(--hint);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sub .dot{opacity:.4}
.kbadge{font-size:12px}
.tag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--raise);color:var(--hint)}
.tag.work{color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent)}
.tag.post{color:var(--o);background:color-mix(in srgb,var(--o) 15%,transparent)}
.trash{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  color:var(--hint);font-size:14px;background:var(--raise)}
.trash:active{transform:scale(.92)}
.cap{font-size:13.5px;line-height:1.45;color:var(--text);opacity:.9;margin:0 0 12px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cap.url{color:var(--a);opacity:1;font-weight:500}
.media{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto;scrollbar-width:none}
.media::-webkit-scrollbar{display:none}
.media .t{width:82px;height:82px;flex:0 0 auto;border-radius:12px;overflow:hidden;position:relative;
  background:var(--raise);border:1px solid var(--line-soft)}
.media .t img{width:100%;height:100%;object-fit:cover}
.media .t .pv{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;color:#fff;background:rgba(0,0,0,.35)}
.mlabel{font-size:10px;font-weight:700;color:var(--hint);margin:2px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.mlabel.res{color:var(--d)}

/* сегмент-контрол статуса */
.seg{display:flex;background:var(--raise);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:9px 3px;border-radius:9px;font-size:12px;font-weight:600;color:var(--hint);
  display:flex;align-items:center;justify-content:center;gap:5px;transition:background .18s,color .18s}
.seg button .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4}
.seg button.on{color:#fff}
.seg button.on .dot{opacity:1;background:#fff}
.seg button.q.on{background:var(--q)} .seg button.p.on{background:var(--p)} .seg button.d.on{background:var(--d)}

.acts{display:flex;gap:8px;margin-top:10px}
.act{flex:1;padding:10px;border-radius:12px;background:var(--raise);border:1px solid var(--line-soft);
  color:var(--text);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .1s}
.act:active{transform:scale(.97)}
.act.plus{background:color-mix(in srgb,var(--d) 15%,transparent);color:var(--d);
  border-color:color-mix(in srgb,var(--d) 30%,transparent)}
.act .ar{color:var(--a)}

/* строка доставки в Ready (честный async) */
.dl{font-size:11.5px;font-weight:600;margin-top:9px;display:flex;align-items:center;gap:7px;
  justify-content:center;padding:8px;border-radius:var(--r-sm)}
.dl.pend{color:var(--q);background:color-mix(in srgb,var(--q) 12%,transparent)}
.dl.sent{color:var(--d);background:color-mix(in srgb,var(--d) 12%,transparent)}
.dspin{width:11px;height:11px;border:2px solid color-mix(in srgb,var(--q) 35%,transparent);
  border-top-color:var(--q);border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto}

/* «Залито» — отдельный флаг, независим от статуса; горит только у того, кто сам залил */
.pbar{margin-top:8px}
.posted{width:100%;padding:10px 12px;border-radius:12px;font-weight:600;font-size:12.5px;
  background:var(--raise);border:1px solid var(--line-soft);color:var(--hint);
  display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;transition:transform .1s}
.posted:active{transform:scale(.98)}
.posted.has{color:var(--o)}
.posted.on{background:color-mix(in srgb,var(--o) 18%,transparent);color:var(--o);
  border-color:color-mix(in srgb,var(--o) 42%,transparent)}
.posted .pn{opacity:.85}

/* ============================ claim-борд ============================ */
.mini{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:12px 13px;margin-bottom:9px;display:flex;align-items:center;gap:11px;box-shadow:var(--sh)}
.mini .b{flex:1;min-width:0}
.mini .t{font-size:13.5px;line-height:1.3;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .m{font-size:11.5px;color:var(--hint);margin-top:3px}
.take{flex:0 0 auto;padding:9px 15px;border-radius:20px;font-weight:700;font-size:12.5px;
  background:color-mix(in srgb,var(--p) 16%,transparent);color:var(--p);transition:transform .1s}
.take:active{transform:scale(.95)}
.owncol{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:12px 13px 6px;margin-bottom:11px;box-shadow:var(--sh)}
.owncol.me{border-color:var(--a-dim)}
.owncol .oh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.owncol .oh .nm{font-weight:700;font-size:13.5px}
.owncol .oh .ct{font-family:var(--mono);font-size:11px;color:var(--hint);margin-left:auto}
.assign{margin-top:8px}
.assign select{width:100%;background:var(--raise);color:var(--text);border:1px solid var(--line-soft);
  border-radius:9px;padding:8px 10px;font-size:12.5px}

/* ============================ статистика ============================ */
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.sgrid.two2{grid-template-columns:1fr 1fr 1fr}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:13px 10px;box-shadow:var(--sh)}
.stat .n{font-family:var(--disp);font-weight:700;font-size:23px;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.stat .l{font-size:10px;color:var(--hint);margin-top:5px;font-weight:600}
.stat.q .n{color:var(--q)} .stat.p .n{color:var(--p)} .stat.d .n{color:var(--d)} .stat.o .n{color:var(--o)}
.lead{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line-soft)}
.lead .nm{flex:0 0 86px;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead .track{flex:1;height:8px;border-radius:4px;background:var(--raise);overflow:hidden}
.lead .bar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--a),var(--a2))}
.lead .bar.o{background:linear-gradient(90deg,var(--o),#c6a9ff)}
.lead .num{flex:0 0 auto;font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--hint)}

/* ============================ строки: задачи / люди ============================ */
.row{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh)}
.row.pin{border-color:var(--a-dim);background:color-mix(in srgb,var(--a) 5%,var(--surface))}
.row .b{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14px;word-break:break-word}
.row .m{font-size:11.5px;color:var(--hint);margin-top:3px}
.prio{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.prio.high{background:var(--a)} .prio.med{background:var(--q)} .prio.low{background:var(--hint)}
.tbtns{display:flex;gap:6px;flex:0 0 auto;align-items:center}
.ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:13.5px;
  background:var(--raise);color:var(--hint);transition:transform .1s}
.ico:active{transform:scale(.92)}
.ico.on{color:var(--a);background:var(--a-dim)}
.pill{font-size:12px;font-weight:600;padding:7px 13px;border-radius:20px;background:var(--raise);
  border:1px solid var(--line-soft);color:var(--hint);flex:0 0 auto;transition:transform .1s}
.pill:active{transform:scale(.95)}
.pill.done{color:var(--d)}
.rolechips{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
.rc{font-size:11px;font-weight:700;padding:5px 10px;border-radius:16px;background:var(--raise);
  border:1px solid var(--line-soft);color:var(--hint);transition:transform .1s}
.rc:active{transform:scale(.94)}
.rc.on{color:#fff}
.rc.admin.on{background:var(--a);border-color:transparent}
.rc.creative.on{background:var(--p);border-color:transparent}
.rc.uploader.on{background:var(--o);border-color:transparent}
.field{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line);
  border-radius:12px;padding:12px;font-size:14.5px;margin-bottom:10px}
.field:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px var(--a-dim)}
.field::placeholder{color:var(--hint)}
.two{display:flex;gap:10px}.two>*{flex:1;margin-bottom:0}
.primary{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-weight:700;
  padding:13px;border-radius:12px;width:100%;font-size:14.5px;
  box-shadow:0 8px 20px -8px color-mix(in srgb,var(--a) 60%,transparent);transition:transform .1s}
.primary:active{transform:scale(.99)}
.primary:disabled{opacity:.5;box-shadow:none}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.panel .ph{font-family:var(--disp);font-weight:600;font-size:14px;margin:0 0 10px}
.note{font-size:12.5px;color:var(--hint);line-height:1.55}

/* ============================ FAB + нижний лист ============================ */
.fab{position:fixed;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;
  border-radius:19px;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-size:28px;
  display:grid;place-items:center;z-index:40;box-shadow:0 12px 28px -8px color-mix(in srgb,var(--a) 65%,transparent);
  transition:transform .12s}
.fab:active{transform:scale(.9)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;
  pointer-events:none;transition:opacity .22s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .28s cubic-bezier(.22,.61,.36,1);max-height:88vh;overflow-y:auto;
  box-shadow:var(--sh-lg)}
.sheet.show{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 14px}
.sheet h3{font-family:var(--disp);font-size:17px;font-weight:700;margin:0 0 4px}
.sheet .hint{font-size:12.5px;color:var(--hint);margin:0 0 14px;line-height:1.5}
.drop{border:1.5px dashed var(--line);border-radius:16px;padding:26px 16px;text-align:center;
  color:var(--hint);font-size:13.5px;margin-bottom:12px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--a);background:color-mix(in srgb,var(--a) 7%,transparent)}
.drop .di{font-size:30px;margin-bottom:8px;opacity:.6}
.drop b{color:var(--a)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.thumbs .th{width:66px;height:66px;border-radius:11px;overflow:hidden;position:relative;
  background:var(--raise);border:1px solid var(--line-soft)}
.thumbs .th img{width:100%;height:100%;object-fit:cover}
.thumbs .th .vf{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.thumbs .th .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:12px;display:grid;place-items:center;line-height:1}
/* прогресс загрузки по файлам */
.uplist{margin-bottom:12px}
.uprow{display:flex;align-items:center;gap:10px;padding:7px 0}
.uprow .un{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uptrack{width:74px;height:6px;border-radius:3px;background:var(--raise);overflow:hidden;flex:0 0 auto}
.upbar{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .2s}
.uppct{font-family:var(--mono);font-size:11px;color:var(--hint);width:36px;text-align:right;flex:0 0 auto}

/* ============================ тост ============================ */
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);background:var(--raise);color:var(--text);border:1px solid var(--line);
  border-radius:13px;padding:11px 16px;font-size:13px;font-weight:500;max-width:88%;z-index:80;opacity:0;
  box-shadow:var(--sh-lg);transition:opacity .25s,transform .25s;text-align:center;line-height:1.4}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:color-mix(in srgb,var(--a) 45%,transparent)}
.toast.ok{border-color:color-mix(in srgb,var(--d) 45%,transparent)}

/* ============================ гейт / загрузка ============================ */
.gate{min-height:72vh;display:grid;place-items:center;text-align:center;padding:26px}
.gate .gh{font-family:var(--disp);font-weight:700;font-size:19px;margin-bottom:7px}
.gate p{color:var(--hint);font-size:14px;max-width:290px;line-height:1.55;margin:0}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);
  border-top-color:var(--a);animation:sp .8s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.dbg{margin-top:16px;font-size:11px;opacity:.6;font-family:var(--mono);word-break:break-all}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="hidden" id="hdr">
  <div class="brand">
    <div class="logo"><div class="mark">F</div><div class="name">FTask</div><span class="sync" id="sync" title="обновить"></span></div>
    <div class="user" id="user"></div>
  </div>
  <div class="rail" id="pipe"></div>
  <nav id="nav"></nav>
</header>
<main id="app">
  <div class="gate"><div><div class="spin"></div><div class="gh">FTask</div>
    <p>Открываю реестр…</p></div></div>
</main>
<script>
const API="https://xgkyuxjvwwstsuhtwhpv.supabase.co/functions/v1/kreo-api";
const CHAT_INTERNAL="3863967700",LINKS_THREAD=3209,READY_THREAD=3;
const tg=window.Telegram&&window.Telegram.WebApp;
try{tg&&tg.ready();tg&&tg.expand();tg&&tg.setHeaderColor&&tg.setHeaderColor("bg_color");}catch(e){}
const S={me:null,creos:[],tasks:[],members:[],stats:null,tab:"all",fAuthor:"",fStatus:"",
  files:[],uploading:false,deliverTo:null,_sig:"",_cap:null};
const KIND={link:"🔗",photo:"🖼",video:"🎬",album:"🗂",text:"📝"};
const ST=[["queued","Очередь","q"],["in_progress","Работа","p"],["done","Готово","d"]];
const RAIL=[["queued","Очередь","q"],["in_progress","Работа","p"],["done","Готово","d"],["posted","Залито","o"]];
const postedList=c=>Array.isArray(c.posters)?c.posters:[];
const iPosted=c=>postedList(c).some(p=>String(p.tg_id)===String(S.me.tg_id));
const HUES=["#ff3b6b","#3aa0ff","#22c58a","#f6a935","#a274ff","#ff7a4d","#12b5b0"];
let TASK_ASG=new Set();   // выбранные исполнители для новой задачи (мульти)

async function api(action,params){
  const r=await fetch(API,{method:"POST",
    headers:{"content-type":"application/json","x-init-data":(tg&&tg.initData)||""},
    body:JSON.stringify(Object.assign({action},params||{}))});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||("HTTP "+r.status));
  return d;
}
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=iso=>{if(!iso)return"";const s=(Date.now()-new Date(iso).getTime())/1000;
  return s<60?"только что":s<3600?Math.floor(s/60)+" мин":s<86400?Math.floor(s/3600)+" ч":Math.floor(s/86400)+" дн";};
const hue=s=>HUES[[...String(s||"?")].reduce((a,c)=>a+c.charCodeAt(0),0)%HUES.length];
const initial=s=>((String(s||"?").trim()[0])||"?").toUpperCase();
const isVid=p=>/\.(mp4|mov|webm|m4v|avi|mkv)(\?|$)/i.test(p||"");
function haptic(t){try{tg.HapticFeedback.impactOccurred(t||"light")}catch(e){}}
function notify(t){try{tg.HapticFeedback.notificationOccurred(t||"success")}catch(e){}}

/* внятные ошибки вместо alert */
const ERR={not_member:"Тебя нет в команде FTask.",forbidden:"Недостаточно прав для этого.",
  admin_only:"Это может только админ.",bad_status:"Неверный статус.",no_files:"Нет файлов для загрузки.",
  not_found:"Крео не найдено — возможно, уже удалили.",cant_remove_self:"Себя убрать нельзя.",
  server:"Сервер не ответил. Попробуй ещё раз.",unauthorized:"Сессия истекла — переоткрой через /app."};
const errMsg=e=>{const m=(e&&e.message)||"";return ERR[m]||"Не вышло. "+(m||"Попробуй ещё раз.");};
function toast(msg,type){
  const t=document.createElement("div");t.className="toast"+(type?" "+type:"");t.textContent=msg;
  document.body.appendChild(t);requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),300);},3000);
}

async function boot(){
  const dbg=tg?("platform "+(tg.platform||"?")+" · initData "+((tg.initData||"").length)+"b"):"вне Telegram";
  try{
    const d=await api("bootstrap");
    absorb(d);
    document.getElementById("hdr").classList.remove("hidden");
    header();render();
    S._sig=sigOf();
    startSync();
  }catch(e){
    const m=e.message==="unauthorized"
      ?"Telegram не передал подпись входа. Открой FTask командой /app в боте и жми inline-кнопку."
      :e.message==="not_member"
      ?("Тебя ещё нет в команде FTask. Скинь админу свой Telegram ID — он добавит тебя во вкладке «Люди», и заходи снова."+
        ((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.id)?"<div class=\"dbg\">твой ID: "+tg.initDataUnsafe.user.id+"</div>":""))
      :("Ошибка: "+esc(e.message));
    document.getElementById("app").innerHTML='<div class="gate"><div><div class="gh">Нет доступа</div>'+
      '<p>'+m+'</p><div class="dbg">'+esc(dbg)+'</div></div></div>';
  }
}
const roles=()=>(S.me&&S.me.roles)||[];
const admin=()=>roles().includes("admin");
const canClaim=()=>admin()||roles().includes("creative");
const nameOf=id=>{const m=S.members.find(x=>x.tg_id===id);return m?(m.name||("@"+(m.username||id))):null;};

/* ---------- realtime через мягкий поллинг ---------- */
function absorb(d){Object.assign(S,{me:d.me,creos:d.creos||[],tasks:d.tasks||[],members:d.members||[],stats:d.stats});}
function sigOf(){
  return JSON.stringify([
    S.creos.map(c=>[c.id,c.status,c.delivery_state,postedList(c).length,c.assignee_tg_id]),
    S.tasks.map(t=>[t.id,t.status,t.pinned,t.position]),
    S.members.map(m=>[m.tg_id,(m.roles||[]).join()])]);
}
function flashSync(){const s=document.getElementById("sync");if(!s)return;
  s.classList.add("on");setTimeout(()=>s.classList.remove("on"),650);}
async function poll(){
  if(!S.me||document.hidden||S.uploading)return;
  if(document.getElementById("scrim").classList.contains("show"))return;   // открыт лист — не мешаем
  const f=document.activeElement;
  if(f&&/^(INPUT|SELECT|TEXTAREA)$/.test(f.tagName))return;                 // идёт ввод — не перерисовываем
  let d;try{d=await api("bootstrap");}catch(e){return;}
  absorb(d);
  const sig=sigOf();
  if(sig!==S._sig){S._sig=sig;const y=window.scrollY;header();render();window.scrollTo(0,y);}
  flashSync();
}
function startSync(){
  setInterval(poll,10000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll();});
  const s=document.getElementById("sync");if(s)s.onclick=()=>{haptic();poll();};
}

function header(){
  const rl=admin()?"АДМИН":(roles().length?roles().map(r=>r==="creative"?"КРЕАТИВ":"ЗАЛИВ").join("·"):"КОМАНДА");
  document.getElementById("user").innerHTML='<span class="un">'+esc(S.me.name||"Вы")+'</span><span class="badge">'+rl+'</span>';
  const c={queued:0,in_progress:0,done:0};S.creos.forEach(x=>c[x.status]!=null&&c[x.status]++);
  const cnt={queued:c.queued,in_progress:c.in_progress,done:c.done,
    posted:S.creos.filter(x=>postedList(x).length).length};
  document.getElementById("pipe").innerHTML=RAIL.map(([k,l,cl])=>
    '<div class="st '+cl+'"><div class="n">'+cnt[k]+'</div><div class="l">'+l+'</div></div>').join("");
  const tabs=[["all","Креативы"],["gen","Генерации"],["mine","Мои"],["stats","Статистика"],["tasks","Задачи"],["members","Люди"]];
  if(admin())tabs.push(["admin","Админка"]);
  document.getElementById("nav").innerHTML=tabs.map(([k,l])=>
    '<button class="'+(S.tab===k?"on":"")+'" data-t="'+k+'">'+l+'</button>').join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;window.scrollTo(0,0);header();render();});
}

function render(){
  const el=document.getElementById("app");killFab();
  if(S.tab==="gen"){el.innerHTML=vGen();bindGen(el);return;}
  if(S.tab==="stats")return el.innerHTML=vStats();
  if(S.tab==="tasks"){el.innerHTML=vTasks();bindTasks(el);return;}
  if(S.tab==="members"){el.innerHTML=vMembers();bindMembers(el);return;}
  if(S.tab==="admin"){el.innerHTML=vAdmin();bindAdmin(el);return;}
  if(S.tab==="mine"){el.innerHTML=vMine();bindCreos(el);fab();return;}
  el.innerHTML=vCreos();bindCreos(el);fab();
}

/* ---------- карточка крео ---------- */
function mediaStrip(c){
  const res=(c.result_urls||[]),src=(c.media_urls||[]);
  const strip=(urls,paths)=>urls.length?'<div class="media">'+urls.map((u,i)=>{
    const v=isVid((paths||[])[i]||u);
    return '<div class="t" data-m="'+esc(u)+'">'+(v?'<div class="pv">▶</div>':'<img loading="lazy" src="'+esc(u)+'">')+'</div>';
  }).join("")+'</div>':"";
  let h="";
  if(src.length)h+=(res.length?'<div class="mlabel">исходник</div>':"")+strip(src,c.storage_paths);
  if(res.length)h+='<div class="mlabel res">готовое ✓</div>'+strip(res,c.result_paths);
  return h;
}
function deliveryLine(c){
  if(c.delivery_state==="pending")
    return '<div class="dl pend"><span class="dspin"></span> Уходит в AvaCarter Ready…</div>';
  if(c.delivery_state==="sent"&&c.ready_msg_id)
    return '<button class="dl sent" data-ready="'+c.id+'">✓ В Ready · открыть ↗</button>';
  return "";
}
function card(c){
  const capUrl=c.kind==="link"&&c.source_url;
  const cap=capUrl?c.source_url:(c.caption||"");
  const seg='<div class="seg">'+ST.map(([k,l,cl])=>
    '<button class="'+cl+(c.status===k?" on":"")+'" data-id="'+c.id+'" data-set="'+k+'"><span class="dot"></span>'+l+'</button>').join("")+'</div>';
  const canOpen=c.source_msg_id&&(c.downloaded_msg_id||c.source_msg_id);
  const canDel=admin()||c.author_tg_id===S.me.tg_id;
  const asg=c.assignee_tg_id?'<span class="tag work">взял: '+esc(nameOf(c.assignee_tg_id)||"?")+'</span>':"";
  const pst=postedList(c).length?'<span class="tag post">✓ залито</span>':"";
  const acts='<div class="acts">'+
    '<button class="act plus" data-plus="'+c.id+'">＋ Залить готовое</button>'+
    (canOpen?'<button class="act" data-open="'+c.id+'"><span class="ar">'+(c.downloaded_msg_id?"▶":"↗")+'</span> '+(c.downloaded_msg_id?"Видео":"Исходник")+'</button>':"")+
    '</div>';
  return '<div class="card"><div class="head">'+
    '<div class="av" style="background:'+hue(c.author_username)+'">'+initial(c.author_username)+'</div>'+
    '<div style="flex:1;min-width:0"><div class="who">'+esc(c.author_username||"—")+'</div>'+
    '<div class="sub"><span class="kbadge">'+(KIND[c.kind]||"📎")+'</span> '+c.kind+' <span class="dot">·</span> '+ago(c.created_at)+' '+asg+pst+'</div></div>'+
    (canDel?'<button class="trash" data-del="'+c.id+'">🗑</button>':"")+'</div>'+
    (cap?'<div class="cap'+(capUrl?" url":"")+'">'+esc(cap)+'</div>':"")+mediaStrip(c)+seg+acts+deliveryLine(c)+postedBar(c)+'</div>';
}
function postedBar(c){
  const ps=postedList(c),mine=iPosted(c);
  let who="";
  if(ps.length){
    const names=ps.map(p=>"@"+esc(p.username||nameOf(p.tg_id)||p.tg_id));
    who=' · <span class="pn">'+names.slice(0,2).join(", ")+(names.length>2?" +"+(names.length-2):"")+'</span>';
  }
  return '<div class="pbar"><button class="posted'+(mine?" on":ps.length?" has":"")+'" data-post="'+c.id+'">'+
    (ps.length?"✓ Залито"+who:"☁ Отметить «Залито»")+'</button></div>';
}
function vCreos(){
  let list=S.creos.slice();
  if(S.fAuthor)list=list.filter(c=>c.author_username===S.fAuthor);
  if(S.fStatus)list=list.filter(c=>c.status===S.fStatus);
  const authors=[...new Set(S.creos.map(c=>c.author_username).filter(Boolean))];
  let h='<div class="filters"><select id="fA"><option value="">Все авторы</option>'+
    authors.map(a=>'<option '+(S.fAuthor===a?"selected":"")+'>'+esc(a)+'</option>').join("")+'</select>'+
    '<select id="fS"><option value="">Любой статус</option>'+
    ST.map(([k,l])=>'<option value="'+k+'" '+(S.fStatus===k?"selected":"")+'>'+l+'</option>').join("")+'</select></div>';
  if(!list.length)return h+'<div class="empty"><div class="e-ic">🗂</div><div class="e-h">Пока нет крео</div>'+
    'Поставь 👍 в AvaKreo Links или залей готовое кнопкой «+».</div>';
  return h+list.map(card).join("");
}
function vMine(){
  const taken=S.creos.filter(c=>c.assignee_tg_id===S.me.tg_id);
  const posted=S.creos.filter(c=>iPosted(c));
  let h="";
  h+='<div class="hh">Взял в работу <span class="c">'+taken.length+'</span></div>';
  h+=taken.length?taken.map(card).join(""):'<div class="empty" style="padding:26px">Ты пока ничего не взял — загляни в «Генерации».</div>';
  h+='<div class="hh">Залил <span class="c">'+posted.length+'</span></div>';
  h+=posted.length?posted.map(card).join(""):'<div class="empty" style="padding:26px">Здесь появятся крео, которые ты запостил.</div>';
  return h;
}
function bindCreos(el){
  const fa=el.querySelector("#fA"),fs=el.querySelector("#fS");
  if(fa)fa.onchange=()=>{S.fAuthor=fa.value;render();};
  if(fs)fs.onchange=()=>{S.fStatus=fs.value;render();};
  el.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>setStatus(+b.dataset.id,b.dataset.set));
  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openCreo(+b.dataset.open));
  el.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>openSheet(+b.dataset.plus));
  el.querySelectorAll("[data-post]").forEach(b=>b.onclick=()=>togglePosted(+b.dataset.post));
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delCreo(+b.dataset.del));
  el.querySelectorAll("[data-ready]").forEach(b=>b.onclick=()=>openReady(+b.dataset.ready));
  el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{try{tg.openLink(b.dataset.m)}catch(e){window.open(b.dataset.m)}});
}
async function setStatus(id,status){
  haptic();const c=S.creos.find(x=>x.id===id);const prev=Object.assign({},c);
  c.status=status;if(status==="in_progress"&&!c.assignee_tg_id)c.assignee_tg_id=S.me.tg_id;
  header();render();
  try{const d=await api("set_creo_status",{id,status,claim:status==="in_progress"});Object.assign(c,d.creo);S._sig=sigOf();header();render();}
  catch(e){Object.assign(c,prev);header();render();toast(errMsg(e),"err");}
}
async function delCreo(id){
  const c=S.creos.find(x=>x.id===id);
  if(!confirm("Точно удалить крео от "+(c&&c.author_username||"—")+"? Это навсегда."))return;
  haptic("medium");
  try{await api("delete_creo",{id});S.creos=S.creos.filter(x=>x.id!==id);S._sig=sigOf();header();render();toast("Крео удалено","ok");}
  catch(e){toast(errMsg(e),"err");}
}
async function togglePosted(id){
  haptic();const c=S.creos.find(x=>x.id===id);const prev=(c.posters||[]).slice();
  const meP={tg_id:S.me.tg_id,username:S.me.username,at:new Date().toISOString()};
  c.posters=iPosted(c)?prev.filter(p=>String(p.tg_id)!==String(S.me.tg_id)):prev.concat([meP]);
  header();render();
  try{const d=await api("toggle_posted",{id});Object.assign(c,d.creo);S._sig=sigOf();header();render();}
  catch(e){c.posters=prev;header();render();toast(errMsg(e),"err");}
}
function openCreo(id){const c=S.creos.find(x=>x.id===id);const m=c.downloaded_msg_id||c.source_msg_id;
  openTg("https://t.me/c/"+CHAT_INTERNAL+"/"+LINKS_THREAD+"/"+m);}
function openReady(id){const c=S.creos.find(x=>x.id===id);if(!c||!c.ready_msg_id)return;
  openTg("https://t.me/c/"+CHAT_INTERNAL+"/"+READY_THREAD+"/"+c.ready_msg_id);}
function openTg(u){try{tg.openTelegramLink(u)}catch(e){window.open(u,"_blank")}}

/* ---------- генерации (claim-борд) ---------- */
function vGen(){
  const free=S.creos.filter(c=>c.status==="queued");
  const taken=S.creos.filter(c=>c.status==="in_progress");
  const byOwner={};taken.forEach(c=>{(byOwner[c.assignee_tg_id]=byOwner[c.assignee_tg_id]||[]).push(c);});
  const miniCap=c=>c.caption||c.source_url||c.kind;
  let h='<div class="hh">Свободные <span class="c">'+free.length+'</span></div>';
  if(free.length){
    h+=free.map(c=>'<div class="mini"><div class="av" style="width:34px;height:34px;font-size:14px;background:'+hue(c.author_username)+'">'+(KIND[c.kind]||"📎")+'</div>'+
      '<div class="b"><div class="t">'+esc(miniCap(c))+'</div><div class="m">от '+esc(c.author_username||"—")+' · '+ago(c.created_at)+'</div></div>'+
      (canClaim()?'<button class="take" data-take="'+c.id+'">Взять</button>':"")+'</div>').join("");
  }else h+='<div class="empty" style="padding:26px">Очередь пуста — всё разобрано 👌</div>';
  h+='<div class="hh">В работе <span class="c">'+taken.length+'</span></div>';
  const owners=Object.keys(byOwner);
  if(!owners.length)h+='<div class="empty" style="padding:26px">Никто пока не взял крео в работу.</div>';
  owners.forEach(oid=>{
    const list=byOwner[oid];const isMe=+oid===S.me.tg_id;
    h+='<div class="owncol'+(isMe?" me":"")+'"><div class="oh"><div class="av" style="width:30px;height:30px;font-size:13px;background:'+hue(nameOf(+oid)||oid)+'">'+initial(nameOf(+oid))+'</div>'+
      '<div class="nm">'+esc(nameOf(+oid)||("id "+oid))+(isMe?" · ты":"")+'</div><div class="ct">'+list.length+' в работе</div></div>';
    h+=list.map(c=>'<div class="mini" style="margin-bottom:8px"><div class="b"><div class="t">'+esc(miniCap(c))+'</div>'+
      '<div class="m">от '+esc(c.author_username||"—")+' · взял '+ago(c.claimed_at||c.created_at)+'</div></div>'+
      (admin()?'<div class="assign"><select data-reassign="'+c.id+'"><option value="">↪ переназначить…</option>'+
        '<option value="0">← вернуть в очередь</option>'+
        S.members.map(m=>'<option value="'+m.tg_id+'"'+(m.tg_id===+oid?" selected":"")+'>'+esc(m.name||("@"+(m.username||m.tg_id)))+'</option>').join("")+
        '</select></div>':"")+'</div>').join("");
    h+='</div>';
  });
  return h;
}
function bindGen(el){
  el.querySelectorAll("[data-take]").forEach(b=>b.onclick=async()=>{haptic();
    const id=+b.dataset.take;const c=S.creos.find(x=>x.id===id);
    try{const d=await api("claim_creo",{id});Object.assign(c,d.creo);S._sig=sigOf();notify();header();render();toast("Взял в работу","ok");}
    catch(e){toast(errMsg(e),"err");}});
  el.querySelectorAll("[data-reassign]").forEach(s=>s.onchange=async()=>{
    const id=+s.dataset.reassign,v=s.value;if(v==="")return;
    const c=S.creos.find(x=>x.id===id);
    try{const d=await api("assign_creo",{id,assignee_tg_id:v==="0"?null:+v});Object.assign(c,d.creo);S._sig=sigOf();header();render();}
    catch(e){toast(errMsg(e),"err");render();}});
}

/* ---------- лист загрузки (доставка к крео / отдельное готовое) ---------- */
function fab(){killFab();const b=document.createElement("button");b.className="fab";b.id="fab";
  b.textContent="+";b.onclick=()=>openSheet(null);document.body.appendChild(b);}
function killFab(){const f=document.getElementById("fab");if(f)f.remove();}
function openSheet(creoId){haptic();S.files=[];S.deliverTo=creoId||null;renderSheet();
  document.getElementById("scrim").classList.add("show");
  requestAnimationFrame(()=>document.getElementById("sheet").classList.add("show"));}
function closeSheet(){if(S.uploading)return;document.getElementById("sheet").classList.remove("show");
  document.getElementById("scrim").classList.remove("show");}
function renderSheet(){
  const s=document.getElementById("sheet");
  const c=S.deliverTo?S.creos.find(x=>x.id===S.deliverTo):null;
  const title=c?"Залить готовое к крео":"Новое готовое крео";
  const hint=c?("Файлы уйдут в AvaCarter Ready, крео станет «готово». Автор: "+esc(c.author_username||"—")):
    "Отдельное готовое без исходного брифа. Уйдёт в AvaCarter Ready и станет «готово».";
  const body=S.uploading
    ? '<div class="uplist" id="uplist">'+S.files.map((f,i)=>
        '<div class="uprow"><span class="un">'+esc(f.name)+'</span>'+
        '<span class="uptrack"><span class="upbar" id="upf-'+i+'"></span></span>'+
        '<span class="uppct" id="upp-'+i+'">0%</span></div>').join("")+'</div>'+
        '<button class="primary" disabled>Отправляю '+S.files.length+'…</button>'
    : '<div class="drop" id="drop"><div class="di">📎</div>Перетащи файлы или <b>выбери</b><br><span style="font-size:12px;opacity:.7">фото и видео, можно несколько</span></div>'+
      '<input id="file" type="file" accept="image/*,video/*" multiple hidden>'+
      (S.files.length?'<div class="thumbs" id="thumbs"></div>':"")+
      '<input class="field" id="cap" placeholder="Подпись к готовому — уйдёт в Ready">'+
      '<button class="primary" id="send"'+(S.files.length?"":" disabled")+'>Отправить'+(S.files.length?" · "+S.files.length:"")+'</button>';
  s.innerHTML='<div class="grip"></div><h3>'+title+'</h3><p class="hint">'+hint+'</p>'+body;
  if(S.uploading)return;
  const drop=s.querySelector("#drop"),file=s.querySelector("#file");
  drop.onclick=()=>file.click();
  file.onchange=()=>{addFiles(file.files);};
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over");};
  drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");addFiles(e.dataTransfer.files);};
  s.querySelector("#send").onclick=doUpload;
  if(S.files.length)drawThumbs();
}
function addFiles(fl){for(const f of fl)S.files.push(f);renderSheet();}
function drawThumbs(){
  const t=document.getElementById("thumbs");if(!t)return;
  t.innerHTML=S.files.map((f,i)=>{const v=f.type.startsWith("video");
    const src=v?"":URL.createObjectURL(f);
    return '<div class="th">'+(v?'<div class="vf">🎬</div>':'<img src="'+src+'">')+'<button class="x" data-rm="'+i+'">×</button></div>';}).join("");
  t.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.files.splice(+b.dataset.rm,1);renderSheet();});
}
function putFile(url,file,onprog){
  return new Promise((res,rej)=>{
    const xhr=new XMLHttpRequest();xhr.open("PUT",url);
    xhr.setRequestHeader("content-type",file.type||"application/octet-stream");
    xhr.setRequestHeader("x-upsert","true");
    xhr.upload.onprogress=e=>{if(e.lengthComputable)onprog(e.loaded/e.total);};
    xhr.onload=()=>(xhr.status>=200&&xhr.status<300)?res():rej(new Error("upload "+xhr.status));
    xhr.onerror=()=>rej(new Error("network"));
    xhr.send(file);
  });
}
async function doUpload(){
  if(!S.files.length||S.uploading)return;
  S._cap=(document.getElementById("cap")||{}).value||null;
  S.uploading=true;renderSheet();
  try{
    const paths=[];
    for(let i=0;i<S.files.length;i++){
      const f=S.files[i];
      const su=await api("sign_upload",{name:f.name});
      await putFile(su.signedUrl,f,frac=>{
        const b=document.getElementById("upf-"+i),p=document.getElementById("upp-"+i);
        if(b)b.style.width=Math.round(frac*100)+"%";if(p)p.textContent=Math.round(frac*100)+"%";
      });
      const b=document.getElementById("upf-"+i),p=document.getElementById("upp-"+i);
      if(b)b.style.width="100%";if(p)p.textContent="✓";
      paths.push(su.path);
    }
    if(S.deliverTo){
      const d=await api("deliver_creo",{id:S.deliverTo,paths,caption:S._cap});
      const c=S.creos.find(x=>x.id===S.deliverTo);if(c)Object.assign(c,d.creo);
    }else{
      const kind=S.files.length>1?"album":(S.files[0].type.startsWith("video")?"video":"photo");
      const d=await api("create_upload_creo",{paths,caption:S._cap,kind});
      S.creos.unshift(d.creo);
    }
    S.uploading=false;S.files=[];S.deliverTo=null;S._cap=null;S._sig=sigOf();
    closeSheet();notify();header();render();toast("Готовое отправляется в Ready","ok");
  }catch(e){S.uploading=false;renderSheet();toast("Ошибка загрузки: "+errMsg(e),"err");}
}

/* ---------- статистика ---------- */
function vStats(){
  const st=S.stats||{byStatus:{queued:0,in_progress:0,done:0},posted:0,byAuthor:[],byPoster:[],avgTurnaroundHours:null,avgPostLagHours:null,total:0};
  const maxA=Math.max(1,...st.byAuthor.map(a=>a.submitted));
  const maxP=Math.max(1,...(st.byPoster||[]).map(a=>a.posted));
  return '<div class="sgrid">'+
    '<div class="stat q"><div class="n">'+st.byStatus.queued+'</div><div class="l">очередь</div></div>'+
    '<div class="stat p"><div class="n">'+st.byStatus.in_progress+'</div><div class="l">в работе</div></div>'+
    '<div class="stat d"><div class="n">'+st.byStatus.done+'</div><div class="l">готово</div></div>'+
    '<div class="stat o"><div class="n">'+(st.posted||0)+'</div><div class="l">залито</div></div></div>'+
    '<div class="sgrid two2"><div class="stat"><div class="n">'+st.total+'</div><div class="l">всего крео</div></div>'+
    '<div class="stat"><div class="n">'+(st.avgTurnaroundHours==null?"—":st.avgTurnaroundHours)+'</div><div class="l">ч до готово</div></div>'+
    '<div class="stat"><div class="n">'+(st.avgPostLagHours==null?"—":st.avgPostLagHours)+'</div><div class="l">ч до залива</div></div></div>'+
    '<div class="hh">Кто сколько сделал</div>'+
    (st.byAuthor.length?st.byAuthor.map(a=>'<div class="lead"><div class="nm">'+esc(a.author)+'</div>'+
      '<div class="track"><div class="bar" style="width:'+Math.round(a.submitted/maxA*100)+'%"></div></div>'+
      '<div class="num">'+a.done+'/'+a.submitted+'</div></div>').join(""):'<div class="empty">Пока нет данных</div>')+
    '<div class="hh">Кто сколько залил</div>'+
    ((st.byPoster||[]).length?st.byPoster.map(a=>'<div class="lead"><div class="nm">'+esc(a.poster)+'</div>'+
      '<div class="track"><div class="bar o" style="width:'+Math.round(a.posted/maxP*100)+'%"></div></div>'+
      '<div class="num">'+a.posted+'</div></div>').join(""):'<div class="empty" style="padding:24px">Ещё ничего не залито.</div>')+
    '<div class="hh">Дальше</div><div class="panel"><div class="note">Автоаналитику (охваты, промежутки постинга, лучшее время) подключим позже — данные уже копятся.</div></div>';
}

/* ---------- задачи ---------- */
function vTasks(){
  const open=S.tasks.filter(t=>t.status!=="done");
  const done=S.tasks.filter(t=>t.status==="done");
  const row=(t,i,arr)=>{
    const aids=Array.isArray(t.assignee_tg_ids)&&t.assignee_tg_ids.length?t.assignee_tg_ids:(t.assignee_tg_id?[t.assignee_tg_id]:[]);
    const who=aids.map(nameOf).filter(Boolean).join(", ");const by=nameOf(t.created_by_tg_id);
    return '<div class="row'+(t.pinned?" pin":"")+'"><div class="prio '+(t.priority||"")+'"></div><div class="b">'+
      '<div class="t">'+(t.pinned?"📌 ":"")+esc(t.title)+'</div>'+
      '<div class="m">'+(t.due_date?"до "+t.due_date+" · ":"")+
      (who?"кому: "+esc(who):"общая")+(by?" · от "+esc(by):"")+'</div></div>'+
      '<div class="tbtns">'+
      (t.status!=="done"&&admin()?'<button class="ico'+(t.pinned?" on":"")+'" data-pin="'+t.id+'" data-pv="'+(t.pinned?0:1)+'">📌</button>':"")+
      (t.status!=="done"&&i!=null&&arr&&i>0?'<button class="ico" data-up="'+t.id+'">▲</button>':"")+
      '<button class="pill '+(t.status==="done"?"done":"")+'" data-tt="'+t.id+'" data-ns="'+(t.status==="done"?"queued":"done")+'">'+
      (t.status==="done"?"↺":"✓ Готово")+'</button>'+
      ((admin()||t.created_by_tg_id===S.me.tg_id)?'<button class="ico" data-tdel="'+t.id+'">🗑</button>':"")+
      '</div></div>';
  };
  return '<div class="panel"><input class="field" id="tT" placeholder="Новая задача — что сделать?" maxlength="200" style="margin-bottom:10px">'+
    '<div class="two" style="margin-bottom:10px"><input class="field" id="tD" type="date"><select class="field" id="tP"><option value="">Приоритет</option>'+
    '<option value="high">Высокий</option><option value="med">Средний</option><option value="low">Низкий</option></select></div>'+
    '<div style="font-size:12px;color:var(--hint);margin:0 2px 8px">Кому — можно несколько · выбрано <span id="asgCnt">'+TASK_ASG.size+'</span></div>'+
    '<div class="rolechips" id="asgChips" style="margin-bottom:12px">'+
    S.members.map(m=>'<button class="rc'+(TASK_ASG.has(m.tg_id)?" creative on":"")+'" data-asg="'+m.tg_id+'">'+esc(m.name||("@"+(m.username||m.tg_id)))+'</button>').join("")+'</div>'+
    '<button class="primary" id="tGo">Добавить задачу</button></div>'+
    '<div class="hh">В работе <span class="c">'+open.length+'</span></div>'+
    (open.length?open.map((t,i)=>row(t,i,open)).join(""):'<div class="empty" style="padding:26px">Задач нет — спланируй неделю.</div>')+
    (done.length?'<div class="hh">История <span class="c">'+done.length+'</span></div>'+done.map(t=>row(t)).join(""):"");
}
function bindTasks(el){
  el.querySelectorAll("[data-asg]").forEach(b=>b.onclick=()=>{haptic();const id=+b.dataset.asg;
    if(TASK_ASG.has(id)){TASK_ASG.delete(id);b.classList.remove("creative","on");}
    else{TASK_ASG.add(id);b.classList.add("creative","on");}
    const c=el.querySelector("#asgCnt");if(c)c.textContent=TASK_ASG.size;});
  el.querySelector("#tGo").onclick=async()=>{
    const title=el.querySelector("#tT").value.trim();if(!title)return;
    try{const d=await api("create_task",{title,due_date:el.querySelector("#tD").value||null,
      priority:el.querySelector("#tP").value||null,assignee_tg_ids:[...TASK_ASG]});
      S.tasks.unshift(d.task);TASK_ASG=new Set();S._sig=sigOf();render();toast("Задача добавлена","ok");}catch(e){toast(errMsg(e),"err");}};
  const patchTask=async(id,patch)=>{const d=await api("update_task",Object.assign({id},patch));
    const i=S.tasks.findIndex(t=>t.id===id);if(i>=0)S.tasks[i]=d.task;S._sig=sigOf();};
  el.querySelectorAll("[data-tt]").forEach(b=>b.onclick=async()=>{haptic();
    try{await patchTask(+b.dataset.tt,{status:b.dataset.ns});render();}catch(e){toast(errMsg(e),"err");}});
  el.querySelectorAll("[data-pin]").forEach(b=>b.onclick=async()=>{haptic();
    try{await patchTask(+b.dataset.pin,{pinned:b.dataset.pv==="1"});render();}catch(e){toast(errMsg(e),"err");}});
  el.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Удалить задачу?"))return;haptic("medium");
    try{await api("delete_task",{id:+b.dataset.tdel});S.tasks=S.tasks.filter(t=>t.id!==+b.dataset.tdel);S._sig=sigOf();render();}catch(e){toast(errMsg(e),"err");}});
  el.querySelectorAll("[data-up]").forEach(b=>b.onclick=async()=>{haptic();
    const id=+b.dataset.up,open=S.tasks.filter(t=>t.status!=="done"),i=open.findIndex(t=>t.id===id);
    if(i<=0)return;const above=open[i-1];
    try{await patchTask(id,{position:(above.position||0)-1});render();}catch(e){toast(errMsg(e),"err");}});
}

/* ---------- люди ---------- */
function roleLabel(r){return r==="admin"?"админ":r==="creative"?"креатив":r==="uploader"?"залив":r;}
function vMembers(){
  return '<div class="hh">Команда <span class="c">'+S.members.length+'</span></div>'+
    S.members.map(m=>{
      const rs=(m.roles||[]);
      const chips=rs.length?rs.map(r=>'<span class="rc '+r+' on">'+roleLabel(r)+'</span>').join(""):'<span class="rc">без роли</span>';
      return '<div class="row"><div class="av" style="width:38px;height:38px;background:'+hue(m.username||m.tg_id)+'">'+initial(m.name||m.username)+'</div>'+
      '<div class="b"><div class="t">'+esc(m.name||"—")+'</div><div class="m">'+(m.username?"@"+esc(m.username):"id "+m.tg_id)+'</div></div>'+
      '<div class="rolechips">'+chips+'</div></div>';
    }).join("")+
    (admin()?'<div class="hh">Добавить</div><div class="panel"><input class="field" id="mI" placeholder="Telegram ID" inputmode="numeric">'+
      '<input class="field" id="mN" placeholder="Имя (необязательно)"><button class="primary" id="mGo">Добавить участника</button>'+
      '<div class="note" style="margin-top:8px">Роли выдаются в «Админке».</div></div>':
      '<div class="hh">Роли</div><div class="panel"><div class="note">Роли и доступ настраивает админ.</div></div>');
}
function bindMembers(el){
  const go=el.querySelector("#mGo");if(go)go.onclick=async()=>{const id=parseInt(el.querySelector("#mI").value,10);if(!id)return;
    try{const d=await api("add_member",{tg_id:id,name:el.querySelector("#mN").value.trim()||null});
      if(!S.members.find(m=>m.tg_id===id))S.members.push(d.member);else S.members[S.members.findIndex(m=>m.tg_id===id)]=d.member;
      S._sig=sigOf();render();toast("Участник добавлен","ok");}catch(e){toast(errMsg(e),"err");}};
}

/* ---------- админка ---------- */
function vAdmin(){
  const ALL=["admin","creative","uploader"];
  let h='<div class="hh">Роли и доступ</div>';
  h+=S.members.map(m=>{
    const rs=(m.roles||[]);
    return '<div class="row"><div class="av" style="width:36px;height:36px;background:'+hue(m.username||m.tg_id)+'">'+initial(m.name||m.username)+'</div>'+
      '<div class="b"><div class="t">'+esc(m.name||"—")+'</div><div class="m">'+(m.username?"@"+esc(m.username):"id "+m.tg_id)+'</div>'+
      '<div class="rolechips" style="margin-top:8px">'+ALL.map(r=>'<button class="rc '+r+(rs.includes(r)?" on":"")+'" data-role-tg="'+m.tg_id+'" data-role="'+r+'">'+roleLabel(r)+'</button>').join("")+'</div></div>'+
      (m.tg_id!==S.me.tg_id?'<button class="ico" data-mdel="'+m.tg_id+'">🗑</button>':"")+'</div>';
  }).join("");
  h+='<div class="hh">Управление ботом</div>'+
     '<div class="panel"><div class="ph">Реестр воркфлоу RunningHub</div>'+
     '<div class="note">Список ВФ (Face Swap, Motion Control, Krea2 и т.д.) и их доступность команде подключим сюда из конфига бота следующим шагом. Запуск генераций остаётся в боте.</div></div>';
  return h;
}
function bindAdmin(el){
  el.querySelectorAll("[data-role]").forEach(b=>b.onclick=async()=>{haptic();
    const tgid=+b.dataset.roleTg,role=b.dataset.role;
    const m=S.members.find(x=>x.tg_id===tgid);const rs=new Set(m.roles||[]);
    if(rs.has(role))rs.delete(role);else rs.add(role);
    const roles=[...rs];
    try{const d=await api("set_member_roles",{tg_id:tgid,roles});m.roles=d.member.roles;
      if(tgid===S.me.tg_id){S.me.roles=d.member.roles;header();}S._sig=sigOf();render();}
    catch(e){toast(errMsg(e),"err");}});
  el.querySelectorAll("[data-mdel]").forEach(b=>b.onclick=async()=>{
    const id=+b.dataset.mdel;if(!confirm("Убрать участника из команды?"))return;haptic("medium");
    try{await api("remove_member",{tg_id:id});S.members=S.members.filter(m=>m.tg_id!==id);S._sig=sigOf();render();toast("Участник убран","ok");}catch(e){toast(errMsg(e),"err");}});
}
boot();
</script>
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
</body>
